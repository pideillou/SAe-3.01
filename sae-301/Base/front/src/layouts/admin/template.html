<div class="flex min-h-screen flex-col bg-fond md:flex-row">
  <aside class="border-b border-bordure bg-surface-haute md:w-60 md:shrink-0 md:border-r md:border-b-0">
    <div class="flex items-center justify-between gap-3 px-5 py-4 md:flex-col md:items-start md:gap-3 md:py-6">
      <p class="font-titres text-xl font-semibold text-razer">RAZER</p>
      <p class="border border-alerte px-2 py-1 text-badge font-semibold tracking-wide text-alerte uppercase">Back-office</p>
    </div>

    <slot name="navigation"></slot>

    <div data-session class="flex flex-col gap-3 border-t border-bordure px-5 py-4 text-sm" hidden>
      <p class="text-texte-secondaire">Connecté en tant que <span data-email class="font-semibold wrap-anywhere text-texte"></span></p>
      <button type="button" data-action="deconnexion" class="min-h-10 border border-bordure px-4 font-titres text-sm font-semibold uppercase transition-colors hover:border-razer hover:text-razer">Se déconnecter</button>
    </div>
  </aside>

  <main class="min-w-0 flex-1">
    <!-- Le slot sans nom reçoit la page affichée (voir lib/router.js). -->
    <slot></slot>
  </main>
</div>
