<section class="flex flex-col gap-6 px-5 py-8 md:px-8">
  <a href="{{cheminListe}}" data-link class="self-start text-mention text-razer underline-offset-4 hover:underline">← Retour aux commandes</a>

  <div class="flex flex-col gap-2">
    <h1 class="font-titres text-titre-page-mobile leading-tight font-semibold uppercase wrap-anywhere md:text-titre-categorie">Commande {{numero}}</h1>
  </div>

  <slot name="message"></slot>

  <div data-contenu class="flex flex-col gap-6">
    <dl class="grid grid-cols-1 gap-px border border-bordure bg-bordure sm:grid-cols-3">
      <div class="flex flex-col gap-1 bg-surface p-4">
        <dt class="text-mention text-texte-secondaire">Statut</dt>
        <dd class="font-semibold {{classesStatut}}">{{statut}}</dd>
      </div>
      <div class="flex flex-col gap-1 bg-surface p-4">
        <dt class="text-mention text-texte-secondaire">Client</dt>
        <dd class="font-semibold wrap-anywhere">{{email}}</dd>
      </div>
      <div class="flex flex-col gap-1 bg-surface p-4">
        <dt class="text-mention text-texte-secondaire">Passée le</dt>
        <dd class="font-semibold">{{date}}</dd>
      </div>
    </dl>

    <div class="grid gap-6 lg:grid-cols-[1fr_24rem] lg:items-start">
      <slot name="recapitulatif"></slot>

      <div class="flex flex-col gap-6">
        <slot name="confirmation"></slot>
        <slot name="actions"></slot>
      </div>
    </div>

    <slot name="journal"></slot>
  </div>
</section>
