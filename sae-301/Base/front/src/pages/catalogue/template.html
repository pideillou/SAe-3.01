<div>
  <!-- Desktop : la navigation par catégories prolonge l'en-tête (bandeau). -->
  <div class="hidden md:block">
    <slot name="bandeau"></slot>
  </div>

  <div class="mx-auto flex max-w-300 flex-col gap-6 px-5 pt-6 pb-14 md:gap-8 md:px-8 md:pt-8">
    <slot name="fil-ariane"></slot>

    <div class="flex flex-col gap-2.5">
      <h1 class="font-titres text-titre-page-mobile leading-tight font-semibold uppercase md:text-titre-page">{{titre}}</h1>
      <p data-resume class="text-sm text-texte-secondaire">{{resume}}</p>
    </div>

    <!-- Mobile : la navigation par catégories est dans le contenu (pastilles). -->
    <div class="md:hidden">
      <slot name="pastilles"></slot>
    </div>

    <slot name="message"></slot>
    <slot name="contenu"></slot>
  </div>

  <!-- Annonce les ajouts au panier aux lecteurs d'écran. -->
  <div data-notification aria-live="polite"></div>
</div>
