<div class="mx-auto flex max-w-300 flex-col gap-6 px-5 pt-6 pb-14 md:gap-8 md:px-8 md:pt-8">
  <slot name="message"></slot>

  <div data-fiche class="flex flex-col gap-6 md:gap-8">
    <div class="flex flex-col gap-4">
      <slot name="fil-ariane"></slot>

      <a href="{{cheminRetour}}" data-link class="text-mention text-razer underline-offset-4 hover:underline">← {{libelleRetour}}</a>
    </div>

    <div class="flex flex-col gap-8 lg:flex-row lg:items-start lg:gap-12">
      <div class="min-w-0 lg:sticky lg:top-6 lg:w-147 lg:shrink-0">
        <slot name="galerie"></slot>
      </div>

      <div class="flex min-w-0 flex-1 flex-col gap-7">
        <div class="flex flex-col gap-3">
          <p class="text-xs tracking-wide text-texte-secondaire uppercase">{{accroche}}</p>
          <h1 class="font-titres text-titre-fiche-mobile leading-tight font-semibold uppercase md:text-titre-fiche">{{nom}}</h1>
          <p class="text-sm leading-relaxed text-texte-secondaire">{{introduction}}</p>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-3 border-y border-bordure py-5">
          <p class="font-titres text-prix-fiche font-semibold"><slot name="prix"></slot></p>
          <slot name="stock"></slot>
        </div>

        <div class="flex flex-col gap-6">
          <slot name="options"></slot>
        </div>

        <p data-note-stock class="text-xs leading-relaxed text-texte-secondaire">{{noteStock}}</p>

        <div>
          <button type="button" data-action="ajouter-panier" class="flex min-h-12 w-full items-center justify-center border border-razer bg-razer px-6 py-3 font-titres text-[0.9375rem] font-semibold text-sur-razer uppercase transition-opacity hover:opacity-90 disabled:cursor-not-allowed disabled:border-dashed disabled:border-erreur disabled:bg-surface disabled:text-erreur disabled:hover:opacity-100">
            Ajouter au panier
          </button>
        </div>
      </div>
    </div>

    <slot name="details"></slot>
  </div>

  <!-- Annonce les ajouts au panier aux lecteurs d'écran. -->
  <div data-notification aria-live="polite"></div>
</div>
