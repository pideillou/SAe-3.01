<section class="flex flex-col gap-6 px-5 py-8 md:px-8">

      <h1 class="font-titres text-titre-page-mobile leading-tight font-semibold uppercase md:text-titre-categorie">Produits</h1>
      <p data-resume class="text-sm text-texte-secondaire">{{resume}}</p>
    </div>

    <a href="{{cheminNouveau}}" data-link class="flex min-h-12 items-center justify-center border border-razer bg-razer px-6 py-3 font-titres text-[0.9375rem] font-semibold text-sur-razer uppercase transition-opacity hover:opacity-90">Nouveau produit</a>

  <slot name="message"></slot>
  <slot name="confirmation"></slot>
  <slot name="tableau"></slot>
