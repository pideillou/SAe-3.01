<section class="mx-auto flex max-w-lg flex-col gap-6 px-5 pt-8 pb-14 md:px-8 md:pt-12">
  <h1 class="font-titres text-titre-page-mobile leading-tight font-semibold uppercase md:text-titre-page">Espace personnel</h1>

  <slot name="message"></slot>

  <div class="flex flex-col gap-5 border border-bordure bg-surface p-6">
    <div class="flex flex-col gap-1">
      <p class="text-mention text-texte-secondaire">Connecté avec l'adresse</p>
      <p class="font-semibold wrap-anywhere">{{email}}</p>
    </div>

    <a href="{{cheminCommandes}}" data-link class="flex min-h-12 w-full items-center justify-center border border-razer bg-razer px-6 py-3 font-titres text-[0.9375rem] font-semibold text-sur-razer uppercase transition-opacity hover:opacity-90">Mes commandes</a>

    <button type="button" data-action="deconnexion" class="flex min-h-12 w-full items-center justify-center border border-bordure px-6 py-3 font-titres text-[0.9375rem] font-semibold uppercase transition-colors hover:border-razer hover:text-razer disabled:cursor-wait disabled:opacity-40">
      Se déconnecter
    </button>
  </div>
</section>
