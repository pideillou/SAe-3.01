<section class="mx-auto max-w-2xl px-5 pt-8 pb-14 md:px-8">
  <h1 class="mb-6 font-titres text-titre-page-mobile leading-tight font-semibold uppercase">Administration</h1>

  <div data-session class="mb-6 flex flex-wrap items-center justify-between gap-3 border border-bordure bg-surface px-4 py-3 text-sm">
    <p class="wrap-anywhere text-texte-secondaire">Connecté en tant que <span class="font-semibold text-texte">{{email}}</span></p>
    <button type="button" data-action="deconnexion" class="min-h-10 border border-bordure px-4 font-titres text-sm font-semibold uppercase transition-colors hover:border-razer hover:text-razer">Se déconnecter</button>
  </div>

  <slot name="message"></slot>
  <slot name="statistiques"></slot>
</section>
