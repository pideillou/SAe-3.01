<section class="mb-6 border border-bordure bg-surface p-6">
  <h2 class="mb-5 font-titres text-xl font-semibold uppercase">Connexion</h2>

  <form class="flex flex-col gap-4">
    <label class="flex flex-col gap-2 text-sm font-medium">
      Identifiant
      <input name="login" type="text" autocomplete="username" value="{{login}}" class="h-11 border border-bordure bg-fond px-3 font-normal text-texte transition-colors hover:border-texte-secondaire" />
    </label>

    <label class="flex flex-col gap-2 text-sm font-medium">
      Mot de passe
      <input name="mdp" type="password" autocomplete="current-password" class="h-11 border border-bordure bg-fond px-3 font-normal text-texte transition-colors hover:border-texte-secondaire" />
    </label>

    <div class="flex flex-wrap gap-3">
      <button type="submit" class="min-h-11 border border-razer bg-razer px-5 font-titres text-sm font-semibold text-sur-razer uppercase transition-opacity hover:opacity-90">
        Se connecter
      </button>
      <!-- type « button » et non « submit » : ce bouton n'envoie pas le formulaire. -->
      <button type="button" data-action="deconnexion" class="min-h-11 border border-bordure px-5 font-titres text-sm font-semibold uppercase transition-colors hover:border-texte-secondaire">
        Se déconnecter
      </button>
    </div>
  </form>
</section>
