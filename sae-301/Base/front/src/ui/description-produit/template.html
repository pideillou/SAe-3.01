<section class="flex flex-col gap-6" aria-labelledby="details-produit">

  <ul data-caracteristiques class="grid gap-3 text-mention text-texte md:grid-cols-3">
    <slot name="caracteristiques"></slot>
  </ul>

  <div data-paragraphes class="flex max-w-3xl flex-col gap-4">
    <slot name="paragraphes"></slot>

  <!-- Un argument par ligne repliable : le texte long ne noie pas la page. -->
  <div data-arguments>
    <slot name="arguments"></slot>
  </div>
</section>
