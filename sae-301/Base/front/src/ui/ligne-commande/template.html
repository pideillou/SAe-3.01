<li class="flex gap-4 border-b border-bordure py-4">
  <img data-image src="{{image}}" width="500" height="500" alt="" decoding="async" loading="lazy" class="aspect-photo w-20 shrink-0 self-start border border-bordure bg-surface object-contain md:w-24" />

  <div class="flex min-w-0 flex-1 flex-col gap-1">
    <p class="font-titres text-base leading-tight font-semibold wrap-anywhere md:text-lg">{{nom}}</p>
    <p class="text-mention text-texte-secondaire">{{quantite}} × {{prixUnitaire}}</p>
  </div>

  <p class="font-titres text-lg font-semibold">{{totalLigne}}</p>
</li>
