<li class="flex flex-wrap gap-4 border-b border-bordure py-5 md:gap-6">
  <a href="{{chemin}}" data-link tabindex="-1" aria-hidden="true" class="block w-24 shrink-0 self-start border border-bordure bg-surface md:w-32">
    <!-- alt vide : le nom du produit, à côté, est déjà un lien vers la même fiche. -->
    <img data-image src="{{image}}" width="500" height="500" alt="" decoding="async" loading="lazy" class="aspect-photo w-full object-contain" />
  </a>

  <div class="flex min-w-0 flex-1 flex-col gap-3 md:flex-row md:items-start md:gap-6">
    <div class="flex min-w-0 flex-1 flex-col gap-1.5">
      <h2 class="font-titres text-base leading-tight font-semibold md:text-lg">
        <a href="{{chemin}}" data-link class="underline-offset-4 hover:text-razer hover:underline">{{titre}}</a>
      </h2>
      <p data-options class="text-mention text-texte">{{options}}</p>
      <p class="text-mention text-texte-secondaire"><slot name="prix"></slot> l'unité</p>
      <p class="text-mention text-texte-secondaire">{{mentionStock}}</p>
      <button type="button" data-action="modifier" data-variante="{{varianteId}}" aria-expanded="false" aria-label="Modifier les options de {{nom}}" class="self-start text-mention text-texte-secondaire underline underline-offset-4 transition-colors hover:text-razer">Modifier les options</button>
    </div>

    <div class="flex flex-wrap items-center justify-between gap-3 md:flex-col md:items-end md:gap-4">
      <div class="flex items-center border border-bordure">
        <button type="button" data-action="moins" aria-label="Diminuer la quantité de {{nom}}" class="flex size-10 items-center justify-center text-lg transition-colors hover:text-razer disabled:cursor-not-allowed disabled:opacity-40">−</button>
        <label for="quantite-{{varianteId}}" class="sr-only">Quantité de {{nom}}</label>
        <input id="quantite-{{varianteId}}" data-quantite type="number" inputmode="numeric" min="1" max="{{stock}}" step="1" value="{{quantite}}" class="h-10 w-14 [appearance:textfield] border-x border-bordure bg-transparent text-center text-sm [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none" />
        <button type="button" data-action="plus" aria-label="Augmenter la quantité de {{nom}}" class="flex size-10 items-center justify-center text-lg transition-colors hover:text-razer disabled:cursor-not-allowed disabled:opacity-40">+</button>
      </div>

      <p class="font-titres text-lg font-semibold">{{totalLigne}}</p>

      <button type="button" data-action="supprimer" aria-label="Supprimer {{nom}} du panier" class="text-mention text-texte-secondaire underline underline-offset-4 transition-colors hover:text-erreur">Supprimer</button>
    </div>
  </div>

  <slot name="edition"></slot>
</li>
