<button type="button" data-valeur="{{valeurId}}" data-etat="{{etat}}" aria-pressed="{{selectionne}}" class="group flex min-w-0 flex-col items-start gap-1.5 border border-bordure bg-surface p-3.5 text-left transition-colors hover:border-texte-secondaire aria-pressed:border-razer aria-pressed:bg-sur-razer">
  <span class="text-mention font-medium wrap-anywhere text-texte group-aria-pressed:text-razer group-data-[etat=indisponible]:text-texte-secondaire">{{libelle}}</span>
  <span class="text-sm font-semibold text-texte group-data-[etat=indisponible]:text-texte-secondaire">{{prix}}</span>
  <span class="text-note text-texte-secondaire group-aria-pressed:text-razer">{{mention}}</span>
</button>
