<button type="button" data-valeur="{{valeurId}}" data-etat="{{etat}}" aria-pressed="{{selectionne}}" class="group flex min-w-0 flex-col items-start gap-1.5 border border-bordure bg-surface p-3.5 text-left transition-colors hover:border-texte-secondaire data-[etat=normal]:aria-pressed:border-razer data-[etat=normal]:aria-pressed:bg-sur-razer data-[etat=indisponible]:border-dashed data-[etat=indisponible]:bg-fond data-[etat=indisponible]:aria-pressed:border-solid data-[etat=indisponible]:aria-pressed:border-erreur">
  <span class="text-mention font-medium wrap-anywhere text-texte group-data-[etat=normal]:group-aria-pressed:text-razer group-data-[etat=indisponible]:text-texte-secondaire">{{libelle}}</span>
  <span class="text-sm font-semibold text-texte group-data-[etat=indisponible]:text-texte-secondaire group-data-[etat=indisponible]:line-through">{{prix}}</span>
  <span class="text-note text-texte-secondaire group-data-[etat=normal]:group-aria-pressed:text-razer group-data-[etat=indisponible]:font-semibold group-data-[etat=indisponible]:text-erreur group-data-[etat=indisponible]:uppercase">{{mention}}</span>
</button>
