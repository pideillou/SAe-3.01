<section aria-labelledby="titre-formulaire-code" class="flex flex-col gap-5 border border-bordure bg-surface p-5 md:p-6">
  <h2 id="titre-formulaire-code" class="font-titres text-xl font-semibold uppercase">{{titre}}</h2>

  <form novalidate class="flex flex-col gap-5">
    <div class="flex flex-col gap-2">
      <label for="code-nom" class="text-sm font-medium">Code</label>
      <input id="code-nom" name="code" type="text" maxlength="30" autocomplete="off" spellcheck="false" value="{{code}}" aria-describedby="aide-code-nom erreur-code-nom" class="h-12 border border-bordure bg-fond px-3 text-texte uppercase transition-colors hover:border-texte-secondaire read-only:border-dashed read-only:text-texte-secondaire aria-invalid:border-erreur" />
      <p id="aide-code-nom" class="text-mention text-texte-secondaire">{{aideCode}}</p>
      <p id="erreur-code-nom" data-erreur="code" class="text-mention text-erreur"></p>
    </div>

    <div class="flex flex-col gap-2">
      <label for="code-pourcentage" class="text-sm font-medium">Réduction (%)</label>
      <input id="code-pourcentage" name="pourcentage" type="text" inputmode="numeric" value="{{pourcentage}}" aria-describedby="erreur-code-pourcentage" class="h-12 w-32 border border-bordure bg-fond px-3 text-texte transition-colors hover:border-texte-secondaire aria-invalid:border-erreur" />
      <p id="erreur-code-pourcentage" data-erreur="pourcentage" class="text-mention text-erreur"></p>
    </div>

    <div class="flex flex-col gap-2">
      <label class="flex items-center gap-3 text-sm">
        <input name="actif" type="checkbox" class="size-5 accent-razer" />
        <span>Code actif (les clients peuvent l'utiliser)</span>
      </label>
      <p data-erreur="actif" class="text-mention text-erreur"></p>
    </div>

    <div class="flex flex-wrap gap-3">
      <button type="submit" class="flex min-h-12 items-center justify-center border border-razer bg-razer px-6 py-3 font-titres text-[0.9375rem] font-semibold text-sur-razer uppercase transition-opacity hover:opacity-90 disabled:cursor-wait disabled:opacity-40">{{bouton}}</button>
      <button type="button" data-action="annuler" class="flex min-h-12 items-center justify-center border border-bordure px-6 py-3 font-titres text-[0.9375rem] font-semibold uppercase transition-colors hover:border-texte-secondaire">Annuler</button>
    </div>
  </form>
</section>
