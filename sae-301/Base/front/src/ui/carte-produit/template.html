<article class="flex flex-col border border-bordure bg-surface transition-colors hover:border-texte-secondaire">
  <a href="{{chemin}}" data-link class="flex flex-1 flex-col">
    <!-- alt vide : le nom du produit, juste en dessous, fait déjà partie du lien. -->
    <img src="{{image}}" width="500" height="500" alt="" decoding="async" class="aspect-photo w-full object-contain" />

    <div class="flex flex-1 flex-col gap-2 p-3 md:p-5">
      <slot name="stock"></slot>

      <h3 class="font-titres text-base leading-tight font-semibold text-texte md:text-xl">{{nom}}</h3>

      <span class="mt-auto flex items-center justify-between gap-2">
        <span class="text-prix-mobile font-semibold text-texte md:text-lg">{{prix}}</span>
        <img src="{{fleche}}" width="18" height="18" alt="" class="size-4.5 shrink-0" />
      </span>
    </div>
  </a>

  <!-- Hors du lien : un bouton ne peut pas être placé dans un lien. -->
  <button type="button" data-action="ajouter-panier" aria-label="Ajouter {{nom}} au panier" class="flex min-h-11 w-full items-center justify-center border-t border-bordure px-3 py-2 font-titres text-sm font-semibold text-razer uppercase transition-colors hover:bg-razer hover:text-sur-razer disabled:cursor-not-allowed disabled:border-dashed disabled:text-erreur disabled:hover:bg-transparent disabled:hover:text-erreur">
    Ajouter au panier
  </button>
</article>
